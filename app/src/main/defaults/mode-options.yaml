    QUIZ_TYPING_SCORED: false
  modes:
    GAMES_ANAGRAM: true
    PRACTICE_TYPED_LISTEN: true
    QUIZ_TYPED_LISTEN: true
    GUIDED_TYPED_LISTEN: true
    PRACTICE_TYPING_SCORED: true
    QUIZ_TYPING_SCORED: true
    GUIDED_TYPING_SCORED: true
    # Added
    GAMES_CROSSWORD: true

