# Factory defaults for study-session mode options.
# Edit a value here and rebuild; app/build.gradle.kts generates ModeOptionDefaults.kt from it
# (compile-time constants, no runtime cost).
#
# One block per option (keyed by its id, matching the ModeOption object's class name in
# ModeOptions.kt), containing everything about it in one place:
#   field:     the underlying ModeDefaultSettings/StudyState property name
#   type:      Boolean | Int | Float | Double | String | IntList
#   default:   the plain default value
#   min/max/step: optional, for numeric controls
#   overrides: (optional) default VALUE for specific CATEGORY_MODE keys, overriding the plain
#              default above; anything not listed falls back to it
#   modes:     which CATEGORY_MODE pairs show this option at all, true or false. Every category
#              sharing one mode (e.g. PRACTICE_LIST/QUIZ_LIST/GUIDED_LIST) must list the exact
#              same set of keys here, so an option can never silently vanish from a sibling.
#              true entries' order is display order in the settings UI. An option missing
#              `modes:` entirely (e.g. ShowCorrectWords) isn't offered in any mode's settings.
#   (occasional extra keys, e.g. autoFlipStartSeconds/palette: a second constant this one
#   option's own control uses internally, not a separately stored field.)

NumberOfAnswers:
  displayName: Number of Answers
  description: How many potential answers to show
  field: numberOfAnswers
  type: Int
  default: 4
  min: 2
  max: 8
  step: 1
  modes:
    PRACTICE_MULTIPLE_CHOICE: true
    QUIZ_MULTIPLE_CHOICE: true
    GUIDED_MULTIPLE_CHOICE: true

ShowCorrectLetters:
  displayName: Show Correct Characters
  description: Change box color or font color to green or red to show if correct or incorrect
